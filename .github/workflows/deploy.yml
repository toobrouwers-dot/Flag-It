name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate files
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('./index.html', 'utf8');
            if (!html.includes('</html>')) { console.error('index.html: missing </html>'); process.exit(1); }
            const sw = fs.readFileSync('./sw.js', 'utf8');
            ['cloud.js','social.js','index.html','manifest.json'].forEach(f => {
              if (!sw.includes(f)) { console.error('sw.js: missing cache entry for ' + f); process.exit(1); }
            });
            console.log('File validation passed');
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
